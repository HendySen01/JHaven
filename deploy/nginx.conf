# 在宿主 Nginx 的 http 上下文中包含；示例仅供本机 HTTPS 入口代理。
# 默认 mime.types 应已在宿主配置中加载。按实际部署位置修改 root。
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/jhaven/web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # 缺失音频返回 404，不能用 SPA HTML 代替音频响应。
    location /audio/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
